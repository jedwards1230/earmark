# Auto-version and release on push to main.
# Release rule for a merged PR: an explicit semver:major|minor|patch label wins
# (semver:none skips the release). With no label, the PR's changed files decide:
# if EVERY file is dev-only (CI, editor/agent config, tests, non-embedded docs;
# see DEV_ONLY in the detect step) no release is cut, otherwise it is a patch.
# No associated PR or an unreadable file list falls back to patch with a
# warning. workflow_dispatch always releases. A release delegates the
# version/tag/Chart.yaml-bump/AI-release-notes pipeline to the shared
# jedwards1230/release-workflows/.github/workflows/ai-release.yml workflow,
# builds the Docker image + publishes the Helm chart, and creates the GitHub
# Release with install snippets prepended to the AI-generated body. Every one
# of those jobs is gated on the detect job's `release` output.
#
# Modeled on jedwards1230/my-wiki's release.yml (same Go-service + Helm-chart
# shape). earmark is amd64-only, so the image build is single-arch.

name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Release: {0}{1}',
           inputs.dry_run && 'dry-run ' || '',
           inputs.bump_type)
      || format('Release: {0}', github.event.head_commit.message || github.sha)
  }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Dry run — compute version and preview notes without tagging or publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect:
    name: Detect bump type
    runs-on: ubuntu-latest
    outputs:
      bump_type: ${{ steps.bump.outputs.type }}
      release: ${{ steps.bump.outputs.release }}
      dry_run: ${{ steps.bump.outputs.dry_run }}
    steps:
      - name: Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # workflow_dispatch: use provided inputs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "type=${{ inputs.bump_type }}"
              echo "release=true"
            } >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Dry run: previewing release with bump_type=${{ inputs.bump_type }}"
            else
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Dev-only paths. With no semver:* label, a merged PR releases as patch
          # UNLESS every changed file matches one of these. Patterns are bash
          # [[ == ]] globs, where `*` also matches `/` -- so 'deploy/x/*' covers
          # the whole subtree and '*_test.go' matches at any depth. Anything not
          # listed counts as product. README*, runner/ (the ASR worker), the Helm
          # chart and openapi.{go,yaml} (embedded in the image via COPY . .) are
          # product on purpose; the rest of docs/ is .dockerignored and not served.
          DEV_ONLY=(
            '.github/*'
            '.devcontainer/*'
            '.claude/*'
            '.vscode/*'
            '.mcp.json'
            'CLAUDE.md'
            '*/CLAUDE.md'
            'AGENTS.md'
            '*/AGENTS.md'
            'CONTRIBUTING*'
            'docs/*.md'
            'docs/design/*'
            '*_test.go'
            'runner/test_*.py'
            '.gitignore'
            '.dockerignore'
            '.env.example'
            '.editorconfig'
            '.golangci*'
            '.pre-commit-config.yaml'
            '.markdownlint*'
            '.yamllint*'
            'Makefile'
            'compose.yaml'
          )
          is_dev_only() {
            local p
            for p in "${DEV_ONLY[@]}"; do
              # shellcheck disable=SC2053 # unquoted on purpose: $p is a glob
              [[ $1 == $p ]] && return 0
            done
            return 1
          }

          # push event: find the merged PR (retry -- the GitHub API may not have
          # the merge commit indexed yet).
          PR=""
          for attempt in 1 2 3; do
            PR=$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls" 2>/dev/null \
              | jq -r --arg sha "$GITHUB_SHA" \
                '[.[] | select(.merge_commit_sha == $sha)][0].number // empty' 2>/dev/null || echo "")
            [ -n "$PR" ] && break
            echo "Attempt ${attempt}: no PR found for ${GITHUB_SHA}, retrying in 5s..."
            sleep 5
          done

          # Rule 3 fallback (no PR / API failure): patch, the pre-existing behavior.
          fallback() {
            echo "::warning::$1 -- falling back to a patch release"
            {
              echo "type=patch"
              echo "release=true"
              echo "dry_run=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "$PR" ] || fallback "No merged PR found for ${GITHUB_SHA} (direct push?)"

          LABELS=$(gh api "repos/${GH_REPO}/issues/${PR}" --jq '.labels[].name' 2>/dev/null) \
            || fallback "Could not read labels for PR #${PR}"
          echo "Labels for PR #${PR}: ${LABELS:-<none>}"

          FILES=""
          if ! FILES=$(gh api "repos/${GH_REPO}/pulls/${PR}/files" --paginate \
                --jq '.[] | .filename, (.previous_filename // empty)' 2>/dev/null) \
             || [ -z "$FILES" ]; then
            FILES=""
          fi

          # Classify the diff: DEV_ONLY=true when every changed file is dev-only.
          DEV_ONLY_DIFF=false
          FIRST_PRODUCT=""
          if [ -n "$FILES" ]; then
            DEV_ONLY_DIFF=true
            while IFS= read -r f; do
              if ! is_dev_only "$f"; then
                DEV_ONLY_DIFF=false
                FIRST_PRODUCT="$f"
                break
              fi
            done <<< "$FILES"
          fi

          # Rule 1: an explicit label always wins.
          LABEL_TYPE=""
          if echo "$LABELS" | grep -qx 'semver:major'; then LABEL_TYPE="major"
          elif echo "$LABELS" | grep -qx 'semver:minor'; then LABEL_TYPE="minor"
          elif echo "$LABELS" | grep -qx 'semver:patch'; then LABEL_TYPE="patch"
          elif echo "$LABELS" | grep -qx 'semver:none'; then LABEL_TYPE="none"
          fi

          if [ -n "$LABEL_TYPE" ]; then
            if [ "$LABEL_TYPE" = none ]; then
              echo "::notice::semver:none label on PR #${PR} -- skipping release"
              echo "type=patch" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              if [ "$DEV_ONLY_DIFF" = true ]; then
                echo "::warning::PR #${PR} carries semver:${LABEL_TYPE} but its diff is dev-only; semver:none (or no label) would skip the release"
              fi
              echo "type=${LABEL_TYPE}" >> "$GITHUB_OUTPUT"
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rule 2: no label -- decide from the changed files.
          [ -n "$FILES" ] || fallback "Could not list changed files for PR #${PR}"
          echo "type=patch" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
          if [ "$DEV_ONLY_DIFF" = true ]; then
            COUNT=$(printf '%s\n' "$FILES" | wc -l)
            echo "::notice::Dev-only rule: all ${COUNT} changed file(s) in PR #${PR} are dev-only (e.g. $(printf '%s\n' "$FILES" | head -3 | paste -sd, -)) -- skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR #${PR} releases as patch; first non-dev-only file: ${FIRST_PRODUCT}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Tag & Generate Notes
    needs: [detect]
    if: needs.detect.outputs.release == 'true'
    uses: jedwards1230/release-workflows/.github/workflows/ai-release.yml@v1
    with:
      service_name: earmark
      service_description: "a Go service that indexes audiobook transcripts and serves semantic search over MCP"
      bump_type: ${{ needs.detect.outputs.bump_type }}
      chart_path: deploy/helm/earmark/Chart.yaml
      dry_run: ${{ needs.detect.outputs.dry_run == 'true' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  build:
    name: Build and Push Image
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Publish Helm Chart
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          helm package deploy/helm/earmark/
          helm push earmark-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Write summary
        run: |
          CHART_VERSION=$(grep '^version:' deploy/helm/earmark/Chart.yaml | awk '{print $2}')
          {
            echo "## Helm Chart Published"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Chart Version | ${CHART_VERSION} |"
            echo "| Registry | \`oci://ghcr.io/${{ github.repository_owner }}/charts/earmark\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: [detect, prepare, build, helm]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compose release body (install snippets + AI notes)
        env:
          BODY_B64: ${{ needs.prepare.outputs.release_body }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # ai-release.yml emits a base64-encoded body; decode before use.
          echo "$BODY_B64" | base64 -d > /tmp/ai_body.md

          # Prepend install snippets so consumers see "how do I get this?"
          # before the AI summary + commit list.
          {
            echo "## Install"
            echo ""
            echo "### Docker"
            echo ""
            echo '```bash'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            echo '```'
            echo ""
            echo "### Helm"
            echo ""
            echo '```bash'
            echo "helm install earmark oci://ghcr.io/${REPO_OWNER}/charts/earmark --version ${VERSION}"
            echo '```'
            echo ""
            echo "---"
            echo ""
          } > /tmp/release_body.md
          cat /tmp/ai_body.md >> /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.version }}
          body_path: /tmp/release_body.md
          make_latest: true

      - name: Write workflow summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUMP_TYPE: ${{ needs.detect.outputs.bump_type }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "## Release ${TAG}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | ${VERSION} |"
            echo "| Image | \`${REGISTRY}/${IMAGE_NAME}:${VERSION}\` |"
            echo "| Chart | \`oci://ghcr.io/${REPO_OWNER}/charts/earmark:${VERSION}\` |"
            echo "| Bump | ${BUMP_TYPE} |"
          } >> "$GITHUB_STEP_SUMMARY"

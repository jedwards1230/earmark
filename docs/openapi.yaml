openapi: 3.1.0
info:
  title: earmark control API
  version: "1.0"
  description: >
    The JSON control API of the earmark binary (`/api/v1`) — the script- and
    agent-facing surface for reading pipeline state and driving the pipeline.
    It writes the `runner_control` row: pause and the bounded-run counter are
    orthogonal axes (`pause` sets `paused=true` and leaves `run_limit` alone;
    `resume` clears the bound; `run N` arms exactly N claims then auto-pauses;
    `clear` drops the bound without touching the pause flag).


    This is **distinct from the htmx dashboard routes** — the page shells, their
    `/…/data` fragments, and the `POST /actions/*` mutations return HTML
    fragments guarded by the `HX-Request` header. Those are deliberately NOT
    part of this contract, and neither are the probe endpoints (`/health`,
    `/healthz`, `/readyz`), `/metrics`, `/static/*`, or the MCP transport at
    `/mcp`.


    `docs/CONTRACT.md` §2.12 is authoritative for the semantics described here.
    `TestOpenAPISync` (internal/mcp) keeps this file in exact sync with the
    registered route table (`apiRoutes` in internal/mcp/routes.go), in both
    directions: an undocumented route and a phantom spec path both fail the
    build.


    **Auth.** Read operations are always open. Mutating operations require
    `Authorization: Bearer <CONTROL_API_TOKEN>` (compared in constant time) and
    **fail closed with 503 when the server has no token configured** — see the
    per-operation responses. This is layered on a LAN-only ingress.
servers:
  - url: /
    description: >
      Same origin as the earmark MCP HTTP transport (default `:8081`, set by
      `MCP_HTTP_ADDR`).

tags:
  - name: status
    description: Read-only pipeline snapshot.
  - name: audit
    description: The audit trail (finding events, judge passes, function calls, step runs, pipeline events), read as stored.
  - name: pipeline
    description: Pause/resume and bounded-run control of the transcription pipeline.
  - name: runner
    description: Runner version-skew and self-update requests.
  - name: meta
    description: The API's own machine-readable contract.

paths:
  /api/v1/status:
    get:
      tags: [status]
      operationId: getStatus
      summary: Pipeline status snapshot
      description: >
        Full pipeline snapshot: queue counts, pause/run-limit state, runner
        heartbeat and update state, the empirical ETA, the configured-vs-observed
        transcription servers, the AI endpoint registry with health probes, and
        the derived 3-stage `pipeline` lifecycle view. Unauthenticated — the
        snapshot is non-sensitive.


        Supplementary sections degrade rather than fail the response: a
        servers/endpoints/ETA/phase read error is logged and the corresponding
        field is left null or empty, so a 200 always carries the primary counts.
      security: []
      responses:
        "200":
          description: Pipeline snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/runs:
    get:
      tags: [status]
      operationId: getRuns
      summary: Ad-hoc step runs — what is running now and recent outcomes
      description: >
        The `step_runs` table (CONTRACT §1.10): every `earmark decide` (dry
        run, `--yes`, `revert`), `earmark scan` and `earmark eval` run records
        one row with a throttled heartbeat. `active` lists the open runs whose
        heartbeat is less than 24 h old, newest first — a run whose heartbeat
        is older than `staleAfterSeconds` (120) has `stale: true` and `status:
        "stale"`: its process died (killed `kubectl exec`, OOM) and it will
        never finish. `recent` lists the newest other runs, including open
        runs abandoned for over 24 h (also stale). Unauthenticated.
      security: []
      parameters:
        - name: recent
          in: query
          required: false
          description: How many non-active runs to list (1..100, default 10).
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Active and recent step runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepRuns" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/audit/{source}:
    get:
      tags: [audit]
      operationId: getAudit
      summary: Audit trail rows of one source, as stored
      description: >
        One generic, read-only view of the tables the pipeline already appends
        to (CONTRACT §2.12.2): `finding_events`, `judge_passes`, `fn_calls`,
        `step_runs`, `pipeline_events`. By default rows are ordered by `id`
        ascending, strictly after `after`, at most `limit` of them; `next` is
        the last row's `id` (pass it back as `after`). With `order=desc` the
        newest rows come first, strictly below `before` (default: from the
        newest row), and `next` is the last — lowest — row's `id` (pass it back
        as `before`; paging down ends at id 1, then `before=1` is an empty
        page). `next` is `null` exactly when `rows` is empty.


        Only an allowlist of slim columns is served per source: no prompt or
        reply bodies, no error text, no command lines and no library paths or
        titles. Text that names a model, host or actor is cut to 256
        characters. Each source accepts only its own equality filters (listed
        per parameter below); a parameter that is not `order`, `after`,
        `before`, `limit` or a filter of this source is a 400, as is a repeated
        or empty one, a value that is not valid UTF-8 or holds a NUL byte, and
        a query string that does not parse. The directions do not mix:
        `order=desc` with `after`, and `before` without `order=desc`, are a
        400. Filters AND together.


        `step_runs` and `judge_passes` rows are updated in place until they
        close, so a row is the current state when read and is never re-sent;
        the other sources are append-only. The cursor is the row id, visible
        at commit, so it is not gap-safe for a tailing client: re-read an
        overlap and de-duplicate on `id` (CONTRACT §2.12.2). At most three
        audit reads run at once per server; one more is a 429.
        Unauthenticated like `/api/v1/status`; the column allowlist is the
        boundary.
      security: []
      parameters:
        - name: source
          in: path
          required: true
          description: The audit source (a table). Anything else is a 404.
          schema:
            type: string
            enum: [finding_events, judge_passes, fn_calls, step_runs, pipeline_events]
        - name: order
          in: query
          required: false
          description: >
            `asc` (default, oldest first, paged with `after`) or `desc` (newest
            first, paged with `before`). Anything else is a 400.
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: after
          in: query
          required: false
          description: >
            Exclusive id cursor of an ascending read; rows with `id` greater
            than this are returned. Plain decimal digits only (no sign, no
            leading zeros). A 400 together with `order=desc`.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: before
          in: query
          required: false
          description: >
            Exclusive id cursor of a descending read; rows with `id` less than
            this are returned, newest first. Plain decimal digits only (no
            sign, no leading zeros); `0` is valid and matches nothing. Omit it
            to start at the newest row. A 400 without `order=desc`.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          description: >
            Rows per page (1..500, default 100), plain decimal digits. Out of
            range is a 400, not clamped.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: finding_id
          in: query
          required: false
          description: "`finding_events` only. UUID of the finding."
          schema: { type: string, format: uuid }
        - name: transcript_id
          in: query
          required: false
          description: "`finding_events`, `judge_passes`. UUID of the transcript."
          schema: { type: string, format: uuid }
        - name: job_id
          in: query
          required: false
          description: "`pipeline_events` only. UUID of the transcription job."
          schema: { type: string, format: uuid }
        - name: recipe_id
          in: query
          required: false
          description: "`finding_events`, `judge_passes`, `fn_calls`, `step_runs`. The recipe id (64 hex characters)."
          schema: { type: string }
        - name: kind
          in: query
          required: false
          description: "`finding_events` only. `transition`, `decision` or `revoke`."
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: "`judge_passes` (`running`, `complete`, `partial`, `failed`, `legacy`) and `step_runs` (`running`, `done`, `failed`, `cancelled`)."
          schema: { type: string }
        - name: fn
          in: query
          required: false
          description: "`fn_calls` only. The pure function name (e.g. `judge_chunk`, `should_apply`). Unindexed: scans the table in id order."
          schema: { type: string }
        - name: error_class
          in: query
          required: false
          description: "`fn_calls` only. The failed call's error class (e.g. `503`, `timeout`). Unindexed: scans the table in id order."
          schema: { type: string }
        - name: step
          in: query
          required: false
          description: "`step_runs` only. The step token: `decide`, `decide_revert`, `scan`, `eval_sample`, `eval_book`, `eval_backfill` or `eval_rejudge`."
          schema: { type: string }
        - name: stage
          in: query
          required: false
          description: "`pipeline_events` only. The pipeline stage (`enqueue`, `embed`, `eval`, `requeue`, …)."
          schema: { type: string }
        - name: event
          in: query
          required: false
          description: "`pipeline_events` only. `start`, `finish`, `error`, `skip`, `retry` or `state`. Unindexed: scans the table in id order."
          schema: { type: string }
      responses:
        "200":
          description: One page of rows (possibly empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
              examples:
                oldestFirst:
                  summary: "`?after=364` — ascending; `next` is the last row's id, pass it back as `after`"
                  value:
                    source: step_runs
                    rows:
                      - id: 365
                        step: decide
                        mode: write
                        recipe_id: f1c32cfe5f8401528d84874ef74e7e853710f4438da2bbd573113e8376caef7a
                        model: clef:27b
                        host: earmark-ingest-7d9f
                        started_at: "2026-10-23T14:02:11.123456+00:00"
                        heartbeat_at: "2026-10-23T14:41:02.500000+00:00"
                        finished_at: null
                        status: running
                        total: 29000
                        done: 12400
                        counters: { apply: 9100, hold: 2800, reject: 500 }
                        cost_usd: 0.42
                    next: 365
                newestFirst:
                  summary: "`?order=desc&limit=2` — descending from the newest row; `next` is the LOWEST id returned, pass it back as `before`"
                  value:
                    source: step_runs
                    rows:
                      - { id: 366, step: scan, mode: dry_run, status: done, total: 50, done: 50, counters: { scanned: 50 } }
                      - { id: 365, step: decide, mode: write, status: running, total: 29000, done: 12400, counters: { apply: 9100, hold: 2800, reject: 500 } }
                    next: 365
                pastTheOldestRow:
                  summary: "`?order=desc&before=1` — nothing below id 1; the end of a newest-first read"
                  value: { source: step_runs, rows: [], next: null }
        "400":
          description: >
            A query string that does not parse; an unknown, repeated or empty
            parameter; a malformed or out-of-range `after`/`before`/`limit`; an
            `order` that is not `asc` or `desc`; `order=desc` together with
            `after`; `before` without `order=desc`; a filter value that is not
            valid UTF-8, holds a NUL byte, or is not a UUID for a UUID filter.
            The message names the valid choices and never echoes a value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unknownFilter:
                  value: { error: "unknown filter \"fn\" for source \"step_runs\"; filters: step, status, recipe_id" }
                mixedDirections:
                  value: { error: "order=desc pages with before, not after" }
        "404":
          description: Unknown audit source. The message lists the valid ones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown audit source \"users\"; sources: finding_events, judge_passes, fn_calls, step_runs, pipeline_events" }
        "429":
          description: >
            Three audit reads are already running in this server. Retry after
            the `Retry-After` interval; nothing was queued.
          headers:
            Retry-After:
              description: Seconds to wait before retrying (always `1`).
              schema:
                type: string
                examples: ["1"]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "too many concurrent audit reads; retry shortly" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: >
            The query exceeded its 5 s statement timeout — narrow it with a
            filter or lower the `limit`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "audit query timed out; add a filter or lower limit" }

  /api/v1/pipeline/pause:
    get:
      tags: [pipeline]
      operationId: getPauseState
      summary: Current pause and bounded-run state
      description: >
        Reads the `runner_control` pause flag and bounded-run counter.
        Unauthenticated.
      security: []
      responses:
        "200":
          description: Current control state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [pipeline]
      operationId: setPauseState
      summary: Pause or resume the pipeline
      description: >
        `paused: true` pauses the pipeline, leaving any bounded run intact
        (`run_limit` untouched). `paused: false` **resumes and clears any
        bounded run** — back to "go, unlimited". The limit is cleared before the
        unpause so there is no window in which the runner could claim unbounded
        work.


        The body is decoded with unknown fields rejected; a missing `paused`,
        a non-boolean `paused`, malformed JSON, or trailing content is a 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PauseRequest" }
            example: { paused: true }
      responses:
        "200":
          description: Authoritative post-write control state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TokenNotConfigured" }

  /api/v1/pipeline/run:
    post:
      tags: [pipeline]
      operationId: startBoundedRun
      summary: Run N jobs then auto-pause
      description: >
        Arms a bounded run: sets `run_limit = N` and then unpauses, so the runner
        claims exactly N jobs and then declines further claims (`run_limit` hits
        0). The limit is written before the unpause, so the runner can never
        claim beyond N even if it polls mid-update; the per-claim decrement
        happens runner-side, which is what makes N exact.


        `{"limit": 1}` is the one-call single-job smoke test. The body is decoded
        with unknown fields rejected; a missing `limit` or `limit < 1` is a 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
            example: { limit: 1 }
      responses:
        "202":
          description: >
            Bounded run armed. Body is the authoritative post-write control
            state (`paused: false`, `runLimit: N`). 202 rather than 200 because
            the work itself is performed asynchronously by the runner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TokenNotConfigured" }
    delete:
      tags: [pipeline]
      operationId: clearBoundedRun
      summary: Clear a bounded run
      description: >
        Clears the bounded-run counter (`run_limit → NULL`, i.e. unlimited)
        **without changing the pause flag** — a paused pipeline stays paused.
        Takes no request body.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative post-write control state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TokenNotConfigured" }

  /api/v1/runner/update:
    post:
      tags: [runner]
      operationId: requestRunnerUpdate
      summary: Request a runner self-update
      description: >
        Records the operator's intent for the ASR runner to switch to an earmark
        git tag: writes `desired_runner_version` and sets the update state to
        `requested`. **The runner — not this handler — performs the swap**; this
        endpoint only authors intent and never calls GitHub.


        An empty or omitted `version` **clears** the request (resets the update
        state). The body is decoded with unknown fields rejected; malformed JSON
        is a 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunnerUpdateRequest" }
            example: { version: "v0.34.0" }
      responses:
        "202":
          description: >
            Request recorded. Body is the authoritative post-write runner-update
            state, re-read from the control row. 202 because the runner applies
            the update asynchronously.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerUpdate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TokenNotConfigured" }

  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenAPISpec
      summary: This API's OpenAPI contract
      description: >
        Returns this document verbatim from bytes embedded in the binary, so a
        deployed instance is self-describing: a client can fetch the exact
        contract the running build was compiled against instead of guessing from
        a repo file. Unauthenticated — the contract is public and must be
        fetchable by a non-browser tool that holds no token.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document, as YAML.
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        `Authorization: Bearer <CONTROL_API_TOKEN>`, compared in constant time
        against the server's configured token. Required by every mutating
        operation.

  responses:
    BadRequest:
      description: >
        Malformed or invalid request body — unparseable JSON, an unknown field
        (bodies are decoded with unknown fields rejected), trailing content, or
        a field that fails its constraint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >
        The bearer token is missing or does not match the server's configured
        `CONTROL_API_TOKEN`.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
            examples: ["Bearer"]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "unauthorized" }
    InternalError:
      description: A database read or write failed. The detail is logged, not returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TokenNotConfigured:
      description: >
        **`CONTROL_API_TOKEN` is unset on the server**, so this endpoint fails
        closed. This is neither an authentication failure (401) nor a transient
        outage — no token exists to authenticate against, so the pipeline can
        never be paused or driven by an unauthenticated caller. Retrying, or
        retrying with a token, will not help: the operator must configure a
        token on the server. Read endpoints are unaffected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "control API token not configured" }

  schemas:
    AuditPage:
      description: |
        One page of an audit source (CONTRACT §2.12.2), rows exactly as stored.
      properties:
        next:
          description: The last returned row's `id` — the highest of an ascending page (pass it back as `after`) and the lowest of a descending one (pass it back as `before`). `null` exactly when `rows` is empty.
          type:
            - integer
            - "null"
        rows:
          description: |
            Row objects in the requested order — by `id` ascending, strictly after `after` (the default), or descending, strictly below `before`; `[]` when nothing matches. The keys are the source's allowlisted columns (CONTRACT §2.12.2) under their column names: timestamps are ISO-8601 with a `+00:00` offset, numerics are JSON numbers, UUIDs are strings, JSONB columns are embedded objects, NULL is `null`. Text that names a model, host or actor is cut to 256 characters; no error text, command line or library path is served.
          items:
            type: object
          type: array
        source:
          description: The requested source.
          enum:
            - finding_events
            - judge_passes
            - fn_calls
            - step_runs
            - pipeline_events
          type: string
      required:
        - source
        - rows
        - next
      type: object
    ETA:
      description: |
        Empirical pipeline ETA (CONTRACT §4). Exposes both the busy-time estimate and the calendar estimate so a caller can tell "3h of GPU work" apart from "done by Tuesday".
      properties:
        calendarKnown:
          description: True when enough history exists to make the calendar estimate meaningful.
          type: boolean
        calendarSeconds:
          description: Estimated wall-clock seconds remaining; meaningful only when calendarKnown.
          type: number
        evalIncluded:
          description: True when eval time is part of the estimate (false → eval timing not yet measured).
          type: boolean
        hasWork:
          description: True when there is anything left to do.
          type: boolean
        label:
          description: Human-rendered estimate, as shown on the dashboard.
          type: string
        remainingChunks:
          description: Chunks still to process.
          type: integer
        workSeconds:
          description: Estimated busy (work) seconds remaining.
          type: number
      required:
        - remainingChunks
        - workSeconds
        - calendarSeconds
        - calendarKnown
        - evalIncluded
        - hasWork
        - label
      type: object
    Endpoint:
      description: |
        One AI endpoint from the registry (CONTRACT §2.14), merged with its liveness probe.
      properties:
        backend:
          description: Backend implementation (e.g. `ollama`).
          type: string
        baseURL:
          description: |
            LAN-internal, non-secret base address — included deliberately so an operator can debug connectivity from the status payload.
          type: string
        gateway:
          description: |
            Routing gateway the endpoint sits behind: the declared AI_ENDPOINTS `gateway` (lower-cased), or `litellm` inferred from a host name containing `litellm`/`llm-gateway`. Omitted for a direct endpoint. Display only.
          type: string
        gatewayInferred:
          description: True when `gateway` was inferred from the host name rather than declared.
          type: boolean
        id:
          type: string
        model:
          type: string
        options:
          additionalProperties:
            type: string
          description: Raw registry options. Omitted when none are configured.
          type: object
        probed:
          description: True when a probe was actually attempted.
          type: boolean
        role:
          description: Registry role this endpoint is bound to. Omitted when unbound.
          type: string
        state:
          description: |
            Probe result — liveness only (GET /models), not call success; see `roles[].state` for call outcomes. `unknown` means not probed (no prober wired), which is distinct from `offline`.
          enum:
            - ready
            - model_not_loaded
            - offline
            - unknown
          type: string
        type:
          description: Endpoint kind (`embeddings`, `chat`, `systemone`).
          type: string
      required:
        - id
        - type
        - backend
        - baseURL
        - model
        - state
        - probed
      type: object
    Error:
      description: The uniform error envelope for every non-2xx control-API response.
      properties:
        error:
          description: Human-readable message. Never echoes request bytes.
          type: string
      required:
        - error
      type: object
    Gateway:
      description: |
        One LiteLLM gateway as seen through earmark's OWN virtual key (CONTRACT §2.14): readiness from `/health/readiness` (fallback `/health/liveliness`) and the caller's own `/key/info`. earmark never uses the master key, never calls a model for this, and never returns key material. Key fields are absent/null when `keyInfoError` is set.
      properties:
        allowedModels:
          description: |
            The key's model allowlist. An empty list means every model is allowed; entries may be wildcards (`anthropic/*`) or `all-proxy-models`. `null` when key info could not be read.
          items:
            type: string
          type:
            - array
            - "null"
        baseHost:
          description: Gateway host[:port] (the endpoint baseURL without a trailing `/v1`).
          type: string
        budgetResetAt:
          type: string
        db:
          type: string
        endpoints:
          description: AI_ENDPOINTS ids routed through this gateway with this key.
          items:
            type: string
          type:
            - array
            - "null"
        health:
          description: Readiness `status` (e.g. `healthy`), or `alive` when only liveliness answered.
          type: string
        keyAlias:
          type: string
        keyBlocked:
          type: boolean
        keyExpires:
          type: string
        keyInfoError:
          description: |
            Why the key info is missing, e.g. "key info not readable by earmark's key (HTTP 403)" or "no API key configured for this endpoint (apiKeyEnv)". Never contains key material.
          type: string
        keyStatus:
          type: string
        maxBudget:
          type:
            - number
            - "null"
        ready:
          description: True when readiness (or the liveliness fallback) returned 200.
          type: boolean
        rpmLimit:
          type:
            - integer
            - "null"
        spend:
          description: Spend in USD tracked against this key.
          type:
            - number
            - "null"
        teamKey:
          description: True for a team-scoped key. With an empty `allowedModels` it inherits the team's models, which earmark's key cannot read, so roles behind it report `modelAllowed` null.
          type: boolean
        tpmLimit:
          type:
            - integer
            - "null"
        version:
          type: string
      required:
        - baseHost
        - endpoints
        - ready
        - keyBlocked
        - spend
        - maxBudget
        - rpmLimit
        - tpmLimit
        - allowedModels
        - teamKey
      type: object
    PauseRequest:
      additionalProperties: false
      properties:
        paused:
          description: |
            True pauses (leaving any bounded run intact); false resumes **and** clears the bounded run.
          type: boolean
      required:
        - paused
      type: object
    PauseState:
      description: |
        The two orthogonal axes of `runner_control`. Returned by every pipeline control endpoint, always re-read after a write so callers see the authoritative state.
      properties:
        paused:
          description: True when the runner is gated and will not claim work.
          type: boolean
        runLimit:
          description: |
            Remaining claims in a bounded run, decremented runner-side. `null` means unlimited (no bound armed).
          type:
            - integer
            - "null"
      required:
        - paused
        - runLimit
      type: object
    PipelineLifecycle:
      description: |
        Derived 3-stage lifecycle view (Transcribe → Eval → Embed), computed at read time from already-fetched signals — no extra DB queries. It exists so an agent reads one self-describing object instead of piecing the state together from the raw counters.
      properties:
        activity:
          description: |
            Operator-facing label; precedence is paused → transcribing → evaluating → embedding → winding-down → idle. `winding-down` means the transcribe queue is drained but the GPU is still busy (eval or embed catch-up).
          enum:
            - transcribing
            - evaluating
            - embedding
            - winding-down
            - idle
            - paused
          type: string
        embedBacklog:
          description: Completed transcripts not yet embedded.
          type: integer
        embeddedReady:
          description: Done with embedded chunks — the terminal, goal state.
          type: integer
        evalCoverage:
          description: |
            Fraction of done jobs that have been judged (0..1). **`-1` is a sentinel** meaning eval is not in the pipeline (not applicable).
          type: number
        evalInPipeline:
          description: Whether `EVAL_IN_PIPELINE` is enabled.
          type: boolean
        evaldOnly:
          description: Done, eval finished, no embedded chunks.
          type: integer
        failed:
          description: |
            Jobs with status `failed`. Off the progress-bar fill (a side exit), kept here for agent convenience.
          type: integer
        fullyDone:
          description: |
            True when every stage is complete: pending, claimed, and embedBacklog are all 0 and eval is covered (or not in the pipeline).
          type: boolean
        gpuCommitted:
          description: True when the pipeline currently owns the GPU (transcribing or evaluating).
          type: boolean
        gpuProbed:
          description: |
            True when a gpu-arbiter probe is configured and reachable, so a consumer can tell "GPU free" from "GPU state unknown".
          type: boolean
        notStarted:
          description: Pending — not yet claimed by any runner.
          type: integer
        phase:
          description: Raw `earmark batch` coordinator phase (CONTRACT §1.4).
          enum:
            - idle
            - transcribe
            - analyze
          type: string
        transcribeDone:
          type: integer
        transcribeTotal:
          type: integer
        transcribedOnly:
          description: Done, no eval completion, no embedded chunks.
          type: integer
        transcribing:
          description: Claimed / in-flight.
          type: integer
      required:
        - activity
        - phase
        - transcribeDone
        - transcribeTotal
        - evalCoverage
        - evalInPipeline
        - embedBacklog
        - gpuCommitted
        - gpuProbed
        - fullyDone
        - notStarted
        - transcribing
        - transcribedOnly
        - evaldOnly
        - embeddedReady
        - failed
      type: object
    Role:
      description: |
        One pipeline role from the Models page role board (CONTRACT §2.14). Health folds endpoint liveness AND call outcomes from run_metrics, so it answers "is this role working" where `endpoints[].state` only answers "is the endpoint up".
      properties:
        answered:
          description: |
            The model that actually answered most recently (judge `eval_resolved_model`, embeddings `embed_model`, ASR the newest transcript's `model_name`). Omitted when nothing has answered.
          type: string
        answeredMatch:
          description: |
            `answered` compared with `expected` (else `requested`), case-insensitive and tolerant of Ollama `:latest`/`:tag` suffixes. Omitted when counts are unavailable.
          enum:
            - match
            - mismatch
            - unreported
            - none
            - unchecked
          type: string
        configured:
          description: True when the role has a binding (ASR_SERVERS, AI_ROLES, or EVAL_CHAT_*).
          type: boolean
        countsAsOf:
          description: |
            When the 30 s aggregate snapshot behind `answered`, the judge's `lastOkAt`/`lastFailedAt`/`lastError`/`failingNow` and the ASR `lastOkAt` was taken. `null` when it has never loaded (those fields are then unknown, not "never"). The embeddings `lastOkAt` comes from live queue stats and `stale` from a separate snapshot (`staleAsOf`).
          type:
            - string
            - "null"
        countsError:
          description: |
            True when the most recent aggregate-snapshot refresh failed (the last good snapshot, if any — see `countsAsOf` — is still served), or, on `decide` and `scan`, when that role's own `fn_calls` aggregate failed or timed out: its `state` is then `unknown` and its `lastOkAt`/`lastFailedAt`/`lastError` are null. A failure of the decide/scan evidence query leaves every other role at `false`.
          type: boolean
        decidePolicy:
          description: 'Decide only: the effective decide policy in one line (e.g. `apply p ≥ 0.85 with asin_verbatim · reject p ≤ 0.20 if the replacement is lowercase or p < 0.10`). Omitted for other roles and when the policy is invalid (see `settingError`). CONTRACT §2.19 "Decide policy".'
          type: string
        decidePolicySource:
          description: 'Decide only: where the policy came from — `default`, `preset <name>`, or the layers that set keys over it (e.g. `db (reject_floor) over preset clef`). CONTRACT §2.19 "Decide policy".'
          type: string
        endpoint:
          description: AI_ENDPOINTS id serving the role, or `EVAL_CHAT_*` for an env-configured judge. Omitted for ASR and unconfigured roles.
          type: string
        expected:
          description: MODELS_FILE `expected_model` pin for the role's step. Omitted when unpinned.
          type: string
        failingNow:
          description: Judge only — transcripts whose latest judge attempt failed (a later success clears it). Not an attempt count. `null` for other roles and when counts are unavailable.
          type:
            - integer
            - "null"
        gateway:
          description: Gateway of the serving endpoint (see `Endpoint.gateway`).
          type: string
        gatewayInferred:
          description: True when `gateway` was inferred from the host name.
          type: boolean
        lastError:
          description: Judge only — the newest still-failing attempt's error, truncated to 300 characters.
          type:
            - string
            - "null"
        lastFailedAt:
          description: Judge only — newest still-failing attempt (`max(run_metrics.eval_failed_at)`).
          type:
            - string
            - "null"
        lastOkAt:
          description: |
            Newest success: judge `max(eval_finished_at)` from ANY source (backfill CronJob, in-pipeline, dashboard — no per-backfill-run marker exists), embeddings the newest chunk, ASR the newest transcript.
          type:
            - string
            - "null"
        modelAllowed:
          description: |
            Whether `requested` is on the LiteLLM virtual key's allowlist (wildcard-aware), reconciled with the endpoint's `/v1/models` probe, which wins: `true` whenever the probe lists the model; `false` only when the allowlist excludes it AND the probe does not list it (every call 403s; the role is `degraded`). `null` when not behind LiteLLM, key info is unreadable, the probe did not run, the requested model is empty, or a team key inherits its team's models.
          type:
            - boolean
            - "null"
        modelSource:
          description: Where the step's model comes from (CONTRACT §2.20) — `db` (a model_settings row), `env` (AI_ENDPOINTS + AI_ROLES), `unset`, or `unknown` when model_settings could not be read. Omitted for roles with no runtime setting (asr, format).
          enum:
            - db
            - env
            - unset
            - unknown
          type: string
        reason:
          description: One-sentence human explanation of `state`.
          type: string
        requested:
          description: The model id earmark sends (or ASR_SERVERS expects).
          type: string
        role:
          enum:
            - asr
            - judge
            - embeddings
            - decide
            - format
          type: string
        settingError:
          description: Set when the step's model_settings row is invalid against this deployment's AI_ENDPOINTS (e.g. its endpoint was removed), or (decide) when the merged decide policy is invalid; the role is then `failing` and the step's runs fail until the row is fixed (`earmark models unset <step>`). CONTRACT §2.19, §2.20.
          type: string
        settingUpdatedAt:
          description: RFC 3339 time the step's model_settings row was last set; omitted without a row.
          type: string
        settingUpdatedBy:
          description: Who set the step's model_settings row (e.g. `cli:justin`); omitted without a row.
          type: string
        stale:
          description: |
            stale_work rows for the role's step (CONTRACT §1.9), from the separate 5 min snapshot (`staleAsOf`). `null` when the step has no current recipe (not tracked) or the stale counts are unavailable or still loading.
          type:
            - integer
            - "null"
        staleAsOf:
          description: When the stale-count snapshot (cached 5 min; a full-library scan) was taken. `null` until it first loads.
          type:
            - string
            - "null"
        state:
          enum:
            - healthy
            - idle
            - degraded
            - failing
            - down
            - not_configured
            - unknown
          type: string
        step:
          description: Recipe step the role runs (`asr`, `propose`, `embed`, `decide`, `format`).
          type: string
      required:
        - role
        - step
        - state
        - reason
        - configured
        - modelAllowed
        - lastOkAt
        - lastFailedAt
        - lastError
        - failingNow
        - stale
        - countsAsOf
        - countsError
        - staleAsOf
      type: object
    RunRequest:
      additionalProperties: false
      properties:
        limit:
          description: Number of jobs to claim before auto-pausing.
          minimum: 1
          type: integer
      required:
        - limit
      type: object
    RunnerUpdate:
      description: |
        Runner version-skew and self-update state (CONTRACT §2.12). Absent from a status response entirely until the runner reports a version or an update is requested, so runners predating the feature stay invisible.
      properties:
        desiredVersion:
          description: Version the operator asked for. Omitted when none is pending.
          type: string
        error:
          description: Last update error reported by the runner. Omitted when none.
          type: string
        runningVersion:
          description: Version the runner reports it is running. Omitted when unknown.
          type: string
        state:
          description: |
            Update state-machine token; the runner owns the `requested → updating → success|failed` transitions. Omitted (or empty) when no update has ever been requested for this runner.
          enum:
            - idle
            - requested
            - updating
            - success
            - failed
          type: string
        updateAvailable:
          description: |
            True when a desired version is set and differs from the running one. Derived from the recorded intent — this server never calls GitHub.
          type: boolean
        updatedAt:
          description: UTC RFC 3339 timestamp of the last state change. Omitted when unset.
          format: date-time
          type: string
      required:
        - updateAvailable
      type: object
    RunnerUpdateRequest:
      additionalProperties: false
      properties:
        version:
          description: |
            Target earmark git tag (e.g. `v0.34.0`). Whitespace is trimmed; an empty or omitted value clears the pending update request.
          type: string
      type: object
    Server:
      description: |
        One transcription server, resolved configured-vs-observed. The backend descriptor and GPU fields are omitted rather than zeroed when unknown, so an undescribed server stays minimal.
      properties:
        capabilities:
          additionalProperties:
            type: boolean
          description: Resolved applied-or-declared capability map.
          type: object
        capsSkippedReason:
          additionalProperties:
            type: string
          description: Why each declined (false) capability was skipped.
          type: object
        computeMode:
          type: string
        configured:
          description: True when the server is declared in `ASR_SERVERS` (vs. observed only).
          type: boolean
        family:
          description: ASR backend family (CONTRACT §2.13), resolved observed > configured.
          type: string
        gpuProbed:
          description: Present only when a `gpuArbiterUrl` is configured for this server.
          type: boolean
        gpuReachable:
          type: boolean
        gpuState:
          description: Raw gpu-arbiter state token (e.g. `available`).
          type: string
        host:
          type: string
        jobsDone:
          type: integer
        meanWordConfidence:
          description: Mean ASR word confidence. Omitted when not reported.
          type: number
        model:
          type: string
        modelSize:
          type: string
        name:
          type: string
        role:
          description: e.g. `primary`.
          type: string
        runtime:
          description: ASR runtime id (CONTRACT §2.13).
          type: string
        state:
          enum:
            - transcribing
            - ready
            - busy
            - stalled
            - offline
            - idle
            - not_seen
          type: string
        vramTotalMb:
          type: integer
        vramUsedMb:
          type: integer
      required:
        - name
        - configured
        - state
        - jobsDone
      type: object
    Status:
      description: |
        Full pipeline snapshot. Fields typed as nullable are always present and may be `null`; fields that are simply absent when unknown are documented as optional.
      properties:
        avgProcessingSeconds:
          description: Per-run aggregate; `null` until the runner/worker populate `run_metrics`.
          type:
            - number
            - "null"
        chunks:
          type: integer
        claimed:
          type: integer
        done:
          type: integer
        doneLastHour:
          type: integer
        embedBacklog:
          description: Completed transcripts not yet embedded.
          type: integer
        endpoints:
          description: |
            AI endpoint registry (CONTRACT §2.14) with health probes. Normally non-empty — at least the embeddings endpoint exists after config load.
          items:
            $ref: '#/components/schemas/Endpoint'
          type:
            - array
            - "null"
        eta:
          description: |
            Empirical ETA (CONTRACT §4); `null` when no estimate could be computed (no history, or a predict-inputs read error).
          oneOf:
            - $ref: '#/components/schemas/ETA'
            - type: "null"
        failed:
          type: integer
        gateways:
          description: |
            Every distinct LiteLLM gateway (declared or inferred) the AI registry routes through, read with earmark's own virtual key. Empty when no endpoint is behind LiteLLM.
          items:
            $ref: '#/components/schemas/Gateway'
          type:
            - array
            - "null"
        lastHeartbeat:
          description: UTC RFC 3339 heartbeat timestamp. Omitted when never seen.
          format: date-time
          type: string
        paused:
          type: boolean
        pending:
          type: integer
        pipeline:
          description: Derived 3-stage lifecycle view; `null` only if it could not be computed.
          oneOf:
            - $ref: '#/components/schemas/PipelineLifecycle'
            - type: "null"
        roles:
          description: |
            The Models page role board (CONTRACT §2.14): always five entries — asr, judge, embeddings, decide, format — built by the same code as the page.
          items:
            $ref: '#/components/schemas/Role'
          type:
            - array
            - "null"
        runLimit:
          description: Remaining claims in a bounded run; `null` means unlimited.
          type:
            - integer
            - "null"
        runnerActive:
          type: boolean
        runnerId:
          description: Reporting runner's id. Omitted when no runner has checked in.
          type: string
        runnerUpdate:
          $ref: '#/components/schemas/RunnerUpdate'
        runs:
          description: |
            The ad-hoc step runs (decide, scan, eval) — the same body as GET /api/v1/runs. `null` when the read failed.
          oneOf:
            - $ref: '#/components/schemas/StepRuns'
            - type: "null"
        servers:
          description: |
            Configured-vs-observed transcription servers. `null` when none are configured or observed, or when the supplementary query failed.
          items:
            $ref: '#/components/schemas/Server'
          type:
            - array
            - "null"
        totalEmbedTokens:
          description: Per-run aggregate; `null` until the runner/worker populate `run_metrics`.
          type:
            - integer
            - "null"
        totalJobs:
          type: integer
        transcripts:
          type: integer
      required:
        - pending
        - claimed
        - done
        - failed
        - transcripts
        - chunks
        - embedBacklog
        - totalJobs
        - doneLastHour
        - paused
        - runLimit
        - runnerActive
        - avgProcessingSeconds
        - totalEmbedTokens
        - eta
        - servers
        - endpoints
        - roles
        - runs
        - gateways
        - pipeline
      type: object
    StepRun:
      properties:
        args:
          type:
            - string
            - "null"
        costUsd:
          type:
            - number
            - "null"
        counters:
          additionalProperties:
            type: integer
          description: |
            Outcome counters (decide: apply/hold/reject/reanchor/cached/errors/skipped/capped; scan: scanned/cached/fallback/errors/written; eval: evaluated/errors/findings, or for a backfill latched/failed/not_embedded/skipped/chunks/chunk_errors/findings; revert: moved/skipped/revoked/reflagged).
          type: object
        done:
          description: |
            Items finished so far.
          type:
            - integer
            - "null"
        elapsedSeconds:
          type: number
        error:
          description: |
            The error a failed or cancelled run ended with.
          type:
            - string
            - "null"
        etaSeconds:
          description: |
            Remaining time at the run's average pace; only for a live running run with a total and some progress.
          type:
            - number
            - "null"
        finishedAt:
          type:
            - string
            - "null"
        heartbeatAt:
          type: string
        host:
          type:
            - string
            - "null"
        id:
          type: integer
        message:
          description: |
            The current phase — what the run is waiting on ("page 3: asking jev-1.13.0", "writing batch 2/9").
          type:
            - string
            - "null"
        mode:
          enum:
            - dry_run
            - write
          type: string
        model:
          type:
            - string
            - "null"
        progress:
          description: |
            done / total (0..1); null without a total.
          type:
            - number
            - "null"
        recipeId:
          type:
            - string
            - "null"
        stale:
          description: |
            True for a running row whose heartbeat stopped advancing (computed at read time).
          type: boolean
        startedAt:
          type: string
        status:
          description: |
            running, done, failed, cancelled, or stale (running with a heartbeat older than staleAfterSeconds — the process is gone).
          enum:
            - running
            - stale
            - done
            - failed
            - cancelled
          type: string
        step:
          description: |
            The step token: decide, decide_revert, scan, eval_sample, eval_book, eval_backfill, eval_rejudge.
          type: string
        total:
          description: |
            Items the run will visit, when known up front (decide --yes counts its work list, capped by --limit; --sample sizes); null = unknown.
          type:
            - integer
            - "null"
      required:
        - id
        - step
        - mode
        - status
        - stale
        - recipeId
        - model
        - args
        - host
        - startedAt
        - heartbeatAt
        - finishedAt
        - total
        - done
        - progress
        - elapsedSeconds
        - etaSeconds
        - counters
        - costUsd
        - message
        - error
      type: object
    StepRuns:
      properties:
        active:
          items:
            $ref: '#/components/schemas/StepRun'
          type:
            - array
            - "null"
        recent:
          items:
            $ref: '#/components/schemas/StepRun'
          type:
            - array
            - "null"
        staleAfterSeconds:
          description: |
            Heartbeat age (seconds) past which a running run reports stale.
          type: integer
      required:
        - active
        - recent
        - staleAfterSeconds
      type: object
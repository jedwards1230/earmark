openapi: 3.1.0
info:
  title: earmark control API
  version: "1.0"
  description: >
    The JSON control API of the earmark binary (`/api/v1`) — the script- and
    agent-facing surface for reading pipeline state and driving the pipeline.
    It writes the `runner_control` row: pause and the bounded-run counter are
    orthogonal axes (`pause` sets `paused=true` and leaves `run_limit` alone;
    `resume` clears the bound; `run N` arms exactly N claims then auto-pauses;
    `clear` drops the bound without touching the pause flag).


    This is **distinct from the htmx dashboard routes** — the page shells, their
    `/…/data` fragments, and the `POST /actions/*` mutations return HTML
    fragments guarded by the `HX-Request` header. Those are deliberately NOT
    part of this contract, and neither are the probe endpoints (`/health`,
    `/healthz`, `/readyz`), `/metrics`, `/static/*`, or the MCP transport at
    `/mcp`.


    `docs/CONTRACT.md` §2.12 is authoritative for the semantics described here.
    `TestOpenAPISync` (internal/mcp) keeps this file in exact sync with the
    registered route table (`apiRoutes` in internal/mcp/routes.go), in both
    directions: an undocumented route and a phantom spec path both fail the
    build.


    **Auth.** Read operations are always open. Mutating operations require
    `Authorization: Bearer <CONTROL_API_TOKEN>` (compared in constant time) and
    **fail closed with 503 when the server has no token configured** — see the
    per-operation responses. This is layered on a LAN-only ingress.
servers:
  - url: /
    description: >
      Same origin as the earmark MCP HTTP transport (default `:8081`, set by
      `MCP_HTTP_ADDR`).

tags:
  - name: status
    description: Read-only pipeline snapshot.
  - name: pipeline
    description: Pause/resume and bounded-run control of the transcription pipeline.
  - name: runner
    description: Runner version-skew and self-update requests.
  - name: meta
    description: The API's own machine-readable contract.

paths:
  /api/v1/status:
    get:
      tags: [status]
      operationId: getStatus
      summary: Pipeline status snapshot
      description: >
        Full pipeline snapshot: queue counts, pause/run-limit state, runner
        heartbeat and update state, the empirical ETA, the configured-vs-observed
        transcription servers, the AI endpoint registry with health probes, and
        the derived 3-stage `pipeline` lifecycle view. Unauthenticated — the
        snapshot is non-sensitive.


        Supplementary sections degrade rather than fail the response: a
        servers/endpoints/ETA/phase read error is logged and the corresponding
        field is left null or empty, so a 200 always carries the primary counts.
      security: []
      responses:
        "200":
          description: Pipeline snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/pipeline/pause:
    get:
      tags: [pipeline]
      operationId: getPauseState
      summary: Current pause and bounded-run state
      description: >
        Reads the `runner_control` pause flag and bounded-run counter.
        Unauthenticated.
      security: []
      responses:
        "200":
          description: Current control state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [pipeline]
      operationId: setPauseState
      summary: Pause or resume the pipeline
      description: >
        `paused: true` pauses the pipeline, leaving any bounded run intact
        (`run_limit` untouched). `paused: false` **resumes and clears any
        bounded run** — back to "go, unlimited". The limit is cleared before the
        unpause so there is no window in which the runner could claim unbounded
        work.


        The body is decoded with unknown fields rejected; a missing `paused`,
        a non-boolean `paused`, malformed JSON, or trailing content is a 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PauseRequest" }
            example: { paused: true }
      responses:
        "200":
          description: Authoritative post-write control state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TokenNotConfigured" }

  /api/v1/pipeline/run:
    post:
      tags: [pipeline]
      operationId: startBoundedRun
      summary: Run N jobs then auto-pause
      description: >
        Arms a bounded run: sets `run_limit = N` and then unpauses, so the runner
        claims exactly N jobs and then declines further claims (`run_limit` hits
        0). The limit is written before the unpause, so the runner can never
        claim beyond N even if it polls mid-update; the per-claim decrement
        happens runner-side, which is what makes N exact.


        `{"limit": 1}` is the one-call single-job smoke test. The body is decoded
        with unknown fields rejected; a missing `limit` or `limit < 1` is a 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
            example: { limit: 1 }
      responses:
        "202":
          description: >
            Bounded run armed. Body is the authoritative post-write control
            state (`paused: false`, `runLimit: N`). 202 rather than 200 because
            the work itself is performed asynchronously by the runner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TokenNotConfigured" }
    delete:
      tags: [pipeline]
      operationId: clearBoundedRun
      summary: Clear a bounded run
      description: >
        Clears the bounded-run counter (`run_limit → NULL`, i.e. unlimited)
        **without changing the pause flag** — a paused pipeline stays paused.
        Takes no request body.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative post-write control state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TokenNotConfigured" }

  /api/v1/runner/update:
    post:
      tags: [runner]
      operationId: requestRunnerUpdate
      summary: Request a runner self-update
      description: >
        Records the operator's intent for the ASR runner to switch to an earmark
        git tag: writes `desired_runner_version` and sets the update state to
        `requested`. **The runner — not this handler — performs the swap**; this
        endpoint only authors intent and never calls GitHub.


        An empty or omitted `version` **clears** the request (resets the update
        state). The body is decoded with unknown fields rejected; malformed JSON
        is a 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunnerUpdateRequest" }
            example: { version: "v0.34.0" }
      responses:
        "202":
          description: >
            Request recorded. Body is the authoritative post-write runner-update
            state, re-read from the control row. 202 because the runner applies
            the update asynchronously.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerUpdate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/TokenNotConfigured" }

  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenAPISpec
      summary: This API's OpenAPI contract
      description: >
        Returns this document verbatim from bytes embedded in the binary, so a
        deployed instance is self-describing: a client can fetch the exact
        contract the running build was compiled against instead of guessing from
        a repo file. Unauthenticated — the contract is public and must be
        fetchable by a non-browser tool that holds no token.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document, as YAML.
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        `Authorization: Bearer <CONTROL_API_TOKEN>`, compared in constant time
        against the server's configured token. Required by every mutating
        operation.

  responses:
    BadRequest:
      description: >
        Malformed or invalid request body — unparseable JSON, an unknown field
        (bodies are decoded with unknown fields rejected), trailing content, or
        a field that fails its constraint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >
        The bearer token is missing or does not match the server's configured
        `CONTROL_API_TOKEN`.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
            examples: ["Bearer"]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "unauthorized" }
    InternalError:
      description: A database read or write failed. The detail is logged, not returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TokenNotConfigured:
      description: >
        **`CONTROL_API_TOKEN` is unset on the server**, so this endpoint fails
        closed. This is neither an authentication failure (401) nor a transient
        outage — no token exists to authenticate against, so the pipeline can
        never be paused or driven by an unauthenticated caller. Retrying, or
        retrying with a token, will not help: the operator must configure a
        token on the server. Read endpoints are unaffected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "control API token not configured" }

  schemas:
    Error:
      type: object
      description: The uniform error envelope for every non-2xx control-API response.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message. Never echoes request bytes.

    PauseState:
      type: object
      description: >
        The two orthogonal axes of `runner_control`. Returned by every pipeline
        control endpoint, always re-read after a write so callers see the
        authoritative state.
      required: [paused, runLimit]
      properties:
        paused:
          type: boolean
          description: True when the runner is gated and will not claim work.
        runLimit:
          type: [integer, "null"]
          description: >
            Remaining claims in a bounded run, decremented runner-side. `null`
            means unlimited (no bound armed).

    PauseRequest:
      type: object
      additionalProperties: false
      required: [paused]
      properties:
        paused:
          type: boolean
          description: >
            True pauses (leaving any bounded run intact); false resumes **and**
            clears the bounded run.

    RunRequest:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit:
          type: integer
          minimum: 1
          description: Number of jobs to claim before auto-pausing.

    RunnerUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          description: >
            Target earmark git tag (e.g. `v0.34.0`). Whitespace is trimmed; an
            empty or omitted value clears the pending update request.

    RunnerUpdate:
      type: object
      description: >
        Runner version-skew and self-update state (CONTRACT §2.12). Absent from
        a status response entirely until the runner reports a version or an
        update is requested, so runners predating the feature stay invisible.
      required: [updateAvailable]
      properties:
        runningVersion:
          type: string
          description: Version the runner reports it is running. Omitted when unknown.
        desiredVersion:
          type: string
          description: Version the operator asked for. Omitted when none is pending.
        state:
          type: string
          enum: [idle, requested, updating, success, failed]
          description: >
            Update state-machine token; the runner owns the
            `requested → updating → success|failed` transitions. Omitted (or
            empty) when no update has ever been requested for this runner.
        error:
          type: string
          description: Last update error reported by the runner. Omitted when none.
        updateAvailable:
          type: boolean
          description: >
            True when a desired version is set and differs from the running one.
            Derived from the recorded intent — this server never calls GitHub.
        updatedAt:
          type: string
          format: date-time
          description: UTC RFC 3339 timestamp of the last state change. Omitted when unset.

    ETA:
      type: object
      description: >
        Empirical pipeline ETA (CONTRACT §4). Exposes both the busy-time
        estimate and the calendar estimate so a caller can tell "3h of GPU work"
        apart from "done by Tuesday".
      required:
        [remainingChunks, workSeconds, calendarSeconds, calendarKnown,
         evalIncluded, hasWork, label]
      properties:
        remainingChunks:
          type: integer
          description: Chunks still to process.
        workSeconds:
          type: number
          description: Estimated busy (work) seconds remaining.
        calendarSeconds:
          type: number
          description: Estimated wall-clock seconds remaining; meaningful only when calendarKnown.
        calendarKnown:
          type: boolean
          description: True when enough history exists to make the calendar estimate meaningful.
        evalIncluded:
          type: boolean
          description: True when eval time is part of the estimate (false → eval timing not yet measured).
        hasWork:
          type: boolean
          description: True when there is anything left to do.
        label:
          type: string
          description: Human-rendered estimate, as shown on the dashboard.

    Endpoint:
      type: object
      description: >
        One AI endpoint from the registry (CONTRACT §2.14), merged with its
        liveness probe.
      required: [id, type, backend, baseURL, model, state, probed]
      properties:
        id:
          type: string
        type:
          type: string
          description: Endpoint kind (e.g. `embeddings`, `chat`).
        backend:
          type: string
          description: Backend implementation (e.g. `ollama`).
        baseURL:
          type: string
          description: >
            LAN-internal, non-secret base address — included deliberately so an
            operator can debug connectivity from the status payload.
        model:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
          description: Raw registry options. Omitted when none are configured.
        role:
          type: string
          description: Registry role this endpoint is bound to. Omitted when unbound.
        state:
          type: string
          enum: [ready, model_not_loaded, offline, unknown]
          description: >
            Probe result. `unknown` means not probed (no prober wired), which is
            distinct from `offline`.
        probed:
          type: boolean
          description: True when a probe was actually attempted.

    Server:
      type: object
      description: >
        One transcription server, resolved configured-vs-observed. The backend
        descriptor and GPU fields are omitted rather than zeroed when unknown,
        so an undescribed server stays minimal.
      required: [name, configured, state, jobsDone]
      properties:
        name:
          type: string
        host:
          type: string
        role:
          type: string
          description: e.g. `primary`.
        configured:
          type: boolean
          description: True when the server is declared in `ASR_SERVERS` (vs. observed only).
        state:
          type: string
          enum: [transcribing, ready, busy, stalled, offline, idle, not_seen]
        model:
          type: string
        modelSize:
          type: string
        computeMode:
          type: string
        jobsDone:
          type: integer
        family:
          type: string
          description: ASR backend family (CONTRACT §2.13), resolved observed > configured.
        runtime:
          type: string
          description: ASR runtime id (CONTRACT §2.13).
        capabilities:
          type: object
          additionalProperties:
            type: boolean
          description: Resolved applied-or-declared capability map.
        capsSkippedReason:
          type: object
          additionalProperties:
            type: string
          description: Why each declined (false) capability was skipped.
        meanWordConfidence:
          type: number
          description: Mean ASR word confidence. Omitted when not reported.
        gpuProbed:
          type: boolean
          description: Present only when a `gpuArbiterUrl` is configured for this server.
        gpuReachable:
          type: boolean
        gpuState:
          type: string
          description: Raw gpu-arbiter state token (e.g. `available`).
        vramUsedMb:
          type: integer
        vramTotalMb:
          type: integer

    PipelineLifecycle:
      type: object
      description: >
        Derived 3-stage lifecycle view (Transcribe → Eval → Embed), computed at
        read time from already-fetched signals — no extra DB queries. It exists
        so an agent reads one self-describing object instead of piecing the
        state together from the raw counters.
      required:
        [activity, phase, transcribeDone, transcribeTotal, evalCoverage,
         evalInPipeline, embedBacklog, gpuCommitted, gpuProbed, fullyDone,
         notStarted, transcribing, transcribedOnly, evaldOnly, embeddedReady,
         failed]
      properties:
        activity:
          type: string
          enum: [transcribing, evaluating, embedding, winding-down, idle, paused]
          description: >
            Operator-facing label; precedence is paused → transcribing →
            evaluating → embedding → winding-down → idle. `winding-down` means
            the transcribe queue is drained but the GPU is still busy (eval or
            embed catch-up).
        phase:
          type: string
          enum: [idle, transcribe, analyze]
          description: Raw `earmark batch` coordinator phase (CONTRACT §1.4).
        transcribeDone:
          type: integer
        transcribeTotal:
          type: integer
        evalCoverage:
          type: number
          description: >
            Fraction of done jobs that have been judged (0..1). **`-1` is a
            sentinel** meaning eval is not in the pipeline (not applicable).
        evalInPipeline:
          type: boolean
          description: Whether `EVAL_IN_PIPELINE` is enabled.
        embedBacklog:
          type: integer
          description: Completed transcripts not yet embedded.
        gpuCommitted:
          type: boolean
          description: True when the pipeline currently owns the GPU (transcribing or evaluating).
        gpuProbed:
          type: boolean
          description: >
            True when a gpu-arbiter probe is configured and reachable, so a
            consumer can tell "GPU free" from "GPU state unknown".
        fullyDone:
          type: boolean
          description: >
            True when every stage is complete: pending, claimed, and embedBacklog
            are all 0 and eval is covered (or not in the pipeline).
        notStarted:
          type: integer
          description: Pending — not yet claimed by any runner.
        transcribing:
          type: integer
          description: Claimed / in-flight.
        transcribedOnly:
          type: integer
          description: Done, no eval completion, no embedded chunks.
        evaldOnly:
          type: integer
          description: Done, eval finished, no embedded chunks.
        embeddedReady:
          type: integer
          description: Done with embedded chunks — the terminal, goal state.
        failed:
          type: integer
          description: >
            Jobs with status `failed`. Off the progress-bar fill (a side exit),
            kept here for agent convenience.

    Status:
      type: object
      description: >
        Full pipeline snapshot. Fields typed as nullable are always present and
        may be `null`; fields that are simply absent when unknown are documented
        as optional.
      required:
        [pending, claimed, done, failed, transcripts, chunks, embedBacklog,
         totalJobs, doneLastHour, paused, runLimit, runnerActive,
         avgProcessingSeconds, totalEmbedTokens, eta, servers, endpoints,
         pipeline]
      properties:
        pending:
          type: integer
        claimed:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        transcripts:
          type: integer
        chunks:
          type: integer
        embedBacklog:
          type: integer
          description: Completed transcripts not yet embedded.
        totalJobs:
          type: integer
        doneLastHour:
          type: integer
        paused:
          type: boolean
        runLimit:
          type: [integer, "null"]
          description: Remaining claims in a bounded run; `null` means unlimited.
        runnerActive:
          type: boolean
        runnerId:
          type: string
          description: Reporting runner's id. Omitted when no runner has checked in.
        lastHeartbeat:
          type: string
          format: date-time
          description: UTC RFC 3339 heartbeat timestamp. Omitted when never seen.
        runnerUpdate:
          $ref: "#/components/schemas/RunnerUpdate"
        avgProcessingSeconds:
          type: [number, "null"]
          description: Per-run aggregate; `null` until the runner/worker populate `run_metrics`.
        totalEmbedTokens:
          type: [integer, "null"]
          description: Per-run aggregate; `null` until the runner/worker populate `run_metrics`.
        eta:
          description: >
            Empirical ETA (CONTRACT §4); `null` when no estimate could be
            computed (no history, or a predict-inputs read error).
          oneOf:
            - $ref: "#/components/schemas/ETA"
            - type: "null"
        servers:
          type: [array, "null"]
          description: >
            Configured-vs-observed transcription servers. `null` when none are
            configured or observed, or when the supplementary query failed.
          items: { $ref: "#/components/schemas/Server" }
        endpoints:
          type: [array, "null"]
          description: >
            AI endpoint registry (CONTRACT §2.14) with health probes. Normally
            non-empty — at least the embeddings endpoint exists after config load.
          items: { $ref: "#/components/schemas/Endpoint" }
        pipeline:
          description: Derived 3-stage lifecycle view; `null` only if it could not be computed.
          oneOf:
            - $ref: "#/components/schemas/PipelineLifecycle"
            - type: "null"
